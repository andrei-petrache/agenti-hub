<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuzzzHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9D%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbf6ef; --card:#fffdf9; --ink:#3b2f2a; --muted:#8a7a70; --line:#efe3d6;
  --orange:#e8875b; --work:#e8875b; --wait:#5aa9e6; --sleep:#b9aea6; --stuck:#e6b34a;
  --shadow:0 2px 0 #efe3d6, 0 8px 24px rgba(120,80,50,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){ --bg:#211c19; --card:#2b2521; --ink:#f3e9df; --muted:#b0a297; --line:#3b332d;
         --shadow:0 2px 0 #3b332d, 0 8px 24px rgba(0,0,0,.3); }
}
/* 🌙 Starry night: deep indigo, neon accents */
:root[data-theme="night"]{
  --bg:#141331; --card:#1f1d45; --ink:#ecebff; --muted:#a3a0d6; --line:#2f2c63;
  --orange:#ff9ec7; --work:#ff9ec7; --wait:#7fe0ff; --sleep:#6f6ba8; --stuck:#ffd36e;
  --shadow:0 2px 0 #2f2c63, 0 10px 30px rgba(0,0,0,.45);
  --body-bg: radial-gradient(1.5px 1.5px at 12% 18%, #fff8 50%, transparent 51%),
             radial-gradient(1px 1px at 72% 12%, #fff9 50%, transparent 51%),
             radial-gradient(1.5px 1.5px at 38% 62%, #fff6 50%, transparent 51%),
             radial-gradient(1px 1px at 88% 48%, #fff8 50%, transparent 51%),
             radial-gradient(1px 1px at 22% 84%, #fff7 50%, transparent 51%),
             radial-gradient(1.5px 1.5px at 60% 90%, #fff6 50%, transparent 51%),
             radial-gradient(ellipse at 80% -10%, #3b2b7a 0%, transparent 55%),
             radial-gradient(ellipse at 0% 110%, #2a1f5c 0%, transparent 50%), #141331;
}
/* 🍵 Matcha: pastel green, calm, like a notebook */
:root[data-theme="matcha"]{
  --bg:#eef4e6; --card:#fbfdf7; --ink:#2c3a2a; --muted:#728370; --line:#dbe6cf;
  --orange:#6aa36f; --work:#e0894f; --wait:#4f9fc4; --sleep:#a9b7a3; --stuck:#d6a83c;
  --shadow:0 2px 0 #dbe6cf, 0 8px 22px rgba(60,90,50,.09);
  --body-bg: radial-gradient(circle at 1px 1px, #c9d8bb 1px, transparent 0) 0 0/22px 22px, #eef4e6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--body-bg, var(--bg));background-attachment:fixed;color:var(--ink);font:15px/1.45 "Nunito","Segoe UI",system-ui,sans-serif}
.themes{display:inline-flex;gap:2px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:2px}
.themes button{border:none;background:none;padding:4px 8px;border-radius:9px;font-size:16px;line-height:1}
.themes button.on{background:color-mix(in srgb,var(--orange) 25%,transparent)}
#langs button{font-size:12px;font-weight:900;padding:5px 8px}
[data-theme="night"] .ag svg .m-body,[data-theme="night"] .map .m-body{filter:drop-shadow(0 0 7px #ffffff35)}
[data-theme="night"] .p-stuck{color:var(--stuck)}
[data-theme="night"] .ag h3,[data-theme="night"] .proj h3,[data-theme="night"] .hello{text-shadow:0 0 18px #ff9ec755}
header{display:flex;align-items:center;gap:14px;padding:18px 28px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}
header .crumb{color:var(--muted);font-weight:700}
header .sp{flex:1}
button,select{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--orange)}
.back{font-weight:800}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:#7cc576;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
main{padding:26px 28px 60px;max-width:1300px;margin:0 auto}
.hello{font-size:26px;font-weight:800;margin:6px 0 4px}
.sub{color:var(--muted);margin:0 0 22px}

/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.proj{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;border:2px solid transparent;position:relative;overflow:hidden}
.proj:hover{transform:translateY(-3px);border-color:var(--c)}
.proj::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.proj .em{font-size:34px}
.proj h3{margin:6px 0 2px;font-size:19px}
.proj p{margin:0 0 12px;color:var(--muted);font-size:13px;min-height:18px}
.minis{display:flex;flex-wrap:wrap;gap:2px;min-height:44px}
.minis svg{width:40px;height:40px}
.counts{display:flex;gap:10px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.d-working{background:var(--work)} .d-waiting{background:var(--wait)} .d-stuck{background:var(--stuck)} .d-sleeping{background:var(--sleep)}

/* agents */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.ag{background:var(--card);border-radius:22px;padding:16px 18px 18px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;transition:transform .15s}
.ag:hover{transform:translateY(-2px);border-color:var(--line)}
.ag.sel{border-color:var(--orange)}
.ag .top{display:flex;gap:12px;align-items:center}
.ag .top svg{width:76px;height:76px;flex:none}
.ag h3{margin:0;font-size:18px;word-break:break-word}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;margin-top:4px}
.p-working{background:color-mix(in srgb,var(--work) 18%,transparent);color:var(--work)}
.p-waiting{background:color-mix(in srgb,var(--wait) 18%,transparent);color:var(--wait)}
.p-stuck{background:color-mix(in srgb,var(--stuck) 22%,transparent);color:#b98418}
.p-sleeping{background:color-mix(in srgb,var(--sleep) 25%,transparent);color:var(--muted)}
.p-asks{background:#ff6b8a;color:#fff;animation:pulse 1.6s infinite}
.act{margin:12px 0 6px;font-size:14px;background:var(--bg);border-radius:12px;padding:8px 11px;min-height:38px;word-break:break-word}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.subs{font-size:12px;color:var(--muted);margin-top:6px}
.section-t{font-weight:800;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin:28px 0 12px}

/* panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--card);box-shadow:-10px 0 40px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .25s;z-index:10;display:flex;flex-direction:column}
.panel.open{transform:none}
@media (min-width:900px){
  :root{--pw:min(460px,42vw)}
  .panel{width:var(--pw);box-shadow:-6px 0 24px rgba(0,0,0,.08)}
  body:has(.panel.open){padding-right:var(--pw)}
}
.act.cmp{border-left:3px solid var(--wait);margin-top:10px}
.cmpb{color:var(--wait);font-weight:700}
.psecs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 2px;align-items:center}
.psecs .lbl{font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}
.psec{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.psec:hover{border-color:var(--orange)}
.psec.on{background:var(--orange);border-color:var(--orange);color:#fff}
.urange{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 2px}
.urange input{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.panel .ph{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.panel .ph svg{width:64px;height:64px}
.panel .pb{overflow:auto;padding:16px 20px 40px}
.panel h4{margin:18px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.bubble{background:var(--bg);border-radius:14px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font-size:14px;max-height:260px;overflow:auto}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:9px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;word-break:break-word}
.feed .ic{flex:none;width:22px;text-align:center}
.feed .tm{color:var(--muted);flex:none;font-size:11px;width:40px;padding-top:2px}
.feed .you{font-weight:700}
.kv{font-size:13px;display:grid;grid-template-columns:80px 1fr;gap:4px 10px;word-break:break-all}
.kv b{color:var(--muted);font-weight:700}
.x{margin-left:auto;font-size:18px;border:none;background:none}
.empty{color:var(--muted);text-align:center;padding:50px 0}
.ptools{display:flex;gap:8px;flex-wrap:wrap;margin:-12px 0 18px}
.ptools button,.linkbtn{font-size:13px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:700}
.ptools button:hover,.linkbtn:hover{border-color:var(--orange)}
.proj.add{border:2px dashed var(--line);box-shadow:none;background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:150px}
.proj.add:hover{border-color:var(--orange)}
.ibtn{border:none;background:none;font-size:16px;cursor:pointer;padding:4px 6px;border-radius:8px;opacity:.75}
.ibtn:hover{opacity:1;background:var(--line)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);color:var(--ink);border-radius:20px;box-shadow:var(--shadow);width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 14px}
.modal label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.modal input,.modal textarea,.modal select{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.modal textarea{min-height:70px;resize:vertical}
.modal input[type=color]{padding:2px;height:38px}
.modal .row2{display:grid;grid-template-columns:90px 90px 1fr;gap:10px}
.modal .row2 label{margin-top:0}
.modal .note{font-size:12px;color:var(--muted);margin:4px 0 0}
.modal .radio{display:flex;gap:8px;align-items:flex-start;font-weight:600;color:var(--ink);margin:6px 0}
.modal .radio input{width:auto;margin-top:3px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.mbtns button{padding:8px 16px;border-radius:12px;cursor:pointer}
.trow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.trow span{flex:1;min-width:0}
.trow small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:14px;box-shadow:var(--shadow);background:var(--card);color:var(--ink);max-width:min(560px,92vw);font-weight:600}
.empty svg{width:110px;height:110px}

/* mascot */
.m-body{transform-origin:50px 88px}
.st-working .m-body{animation:bob .7s ease-in-out infinite}
.st-working .m-star{animation:spin 2.2s linear infinite;transform-origin:50px 17px}
.st-waiting .m-arm{animation:wave 1.2s ease-in-out infinite;transform-origin:78px 62px}
.st-waiting .m-eyes{animation:blink 4s infinite;transform-origin:50px 54px}
.st-sleeping .m-body{animation:breathe 3.5s ease-in-out infinite}
.st-stuck .m-body{animation:wobble 2s ease-in-out infinite}
.m-z{animation:zz 2.4s ease-in-out infinite;opacity:0}
.m-z2{animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-5px) scaleY(1.03)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{50%{transform:rotate(-28deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes breathe{50%{transform:scale(1.035,.97)}}
@keyframes wobble{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.st-working .m-led{animation:led 1s steps(2) infinite}
.m-cursor{animation:led 1s steps(2) infinite}
.st-waiting .m-led{animation:pulse 2s infinite}
.m-steam{animation:steam 2s ease-in-out infinite}
@keyframes led{50%{opacity:.25}}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-4px)}}
.persona{font-size:12px;color:var(--muted);margin-top:3px}
.eng{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:8px;background:#10a37f;color:#fff;margin-left:6px;vertical-align:middle;letter-spacing:.3px}
.rvtext{max-height:280px;overflow:auto;white-space:pre-wrap}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@media (max-width:600px){header,main{padding-left:16px;padding-right:16px}}

/* 🏡 workshop: every agent has a room and walks between mailbox, terminal, desk, window and shelf */
#workshop{position:relative;margin-top:14px}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:18px;align-items:start}
.room{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .2s,transform .15s}
.room:hover{transform:translateY(-2px)}
.room.sel{border-color:var(--orange)}
.room.asking{border-color:#ff6b8a;box-shadow:0 0 0 4px color-mix(in srgb,#ff6b8a 22%,transparent),var(--shadow)}
.room.got-mail .scene,.room.buzzing .scene{animation:buzz .6s linear}
.room-top{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.room-top .name{font-weight:800;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-top .pill{margin-top:0}
.scene{position:relative;height:200px;overflow:hidden}
.wall{position:absolute;inset:0 0 30% 0;background:color-mix(in srgb,var(--c) 12%,var(--card))}
.planks{position:absolute;inset:70% 0 0 0;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,var(--bg)) 0 44px,color-mix(in srgb,var(--c) 28%,var(--bg)) 44px 46px)}
.prop{position:absolute;bottom:30%;transform:translateX(-50%);opacity:.7;transition:opacity .3s,filter .3s}
.room[data-z="terminal"] .p-terminal,.room[data-z="desk"] .p-desk,.room[data-z="shelf"] .p-shelf,
.room[data-z="window"] .p-window,.room[data-z="mail"] .p-mail{opacity:1;filter:drop-shadow(0 0 9px color-mix(in srgb,var(--c) 80%,transparent))}
.p-mail{left:9%;font-size:30px;line-height:1}
.p-terminal{left:27%;width:66px}
.p-terminal .screen{height:46px;background:#1d2030;border-radius:7px;border:3px solid #3b3f52;padding:4px 5px;font:700 7.5px/1.25 ui-monospace,Consolas,monospace;color:#7ef0c8;overflow:hidden;word-break:break-all}
.p-terminal .stand{width:12px;height:8px;background:#3b3f52;margin:0 auto}
.p-desk{left:48%;width:118px}
.p-desk .monitor{width:58px;height:38px;margin:0 auto;background:#25283a;border-radius:6px;border:3px solid #c9ccd6;padding:5px 5px;overflow:hidden}
.p-desk .monitor i{display:block;height:3px;border-radius:2px;background:#7fd0ff;margin:0 0 3px;opacity:.85}
.room[data-z="desk"].working .p-desk .monitor i{animation:typing 1.4s steps(6) infinite}
.room[data-z="desk"].working .p-desk .monitor i:nth-child(2){animation-delay:.35s;background:#ffd36e}
.room[data-z="desk"].working .p-desk .monitor i:nth-child(3){animation-delay:.7s;background:#ff9ec7}
@keyframes typing{0%{width:10%}100%{width:100%}}
.p-desk .top{height:9px;background:#b07a52;border-radius:4px;margin-top:4px}
.p-desk .legs{display:flex;justify-content:space-between;padding:0 8px}.p-desk .legs b{width:6px;height:22px;background:#8a5a3c;display:block}
.p-window{left:67%;bottom:auto;top:12%;width:58px;height:46px;border-radius:8px;border:4px solid color-mix(in srgb,var(--c) 45%,#fff);
  background:linear-gradient(#9fd3f5,#d8efff);overflow:hidden}
.p-window::after{content:"";position:absolute;left:8px;top:16px;width:22px;height:8px;border-radius:8px;background:#fff;box-shadow:14px -5px 0 -1px #fff;animation:cloud 9s linear infinite}
[data-theme="night"] .p-window{background:linear-gradient(#1a1850,#3b2b7a)}
[data-theme="night"] .p-window::after{background:#fff6c0;width:10px;height:10px;box-shadow:none;left:34px;top:8px;animation:none}
@keyframes cloud{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
.p-shelf{left:87%;width:48px;height:78px;background:#8a5a3c;border-radius:4px;padding:4px;display:flex;flex-direction:column;justify-content:space-around}
.p-shelf b{display:block;height:14px;border-radius:1px;background:repeating-linear-gradient(90deg,#e97a7a 0 6px,#6fb1e0 6px 11px,#8cc56b 11px 16px,#e6b34a 16px 21px,#d98fc2 21px 26px,transparent 26px 28px)}
.bot{position:absolute;bottom:7%;left:48%;width:86px;transform:translateX(-50%);transition:left 1.3s ease-in-out;z-index:2}
.bot .masc svg{width:86px;height:86px;display:block}
.bot.walking .masc{animation:walk .3s ease-in-out infinite}
@keyframes walk{50%{transform:translateY(-7px) rotate(4deg)}}
.speech{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;
  padding:4px 9px;font-size:11.5px;font-weight:700;line-height:1.25;width:max-content;max-width:200px;box-shadow:0 3px 8px rgba(0,0,0,.08);word-break:break-word}
.speech:empty{display:none}
.bot[data-z="mail"] .speech,.bot[data-z="terminal"] .speech{left:0;transform:none}
.bot[data-z="shelf"] .speech,.bot[data-z="window"] .speech{left:auto;right:0;transform:none}
.room.asking .speech{background:#ff6b8a;color:#fff;border-color:#ff6b8a}
.effect{position:absolute;top:2px;right:-6px;font-size:21px;animation:float 1.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-8deg)}}
.crew-h{font-size:12px;color:var(--muted);font-weight:800;padding:8px 14px 0;border-top:1px dashed var(--line)}
.crew-list{display:flex;gap:4px;flex-wrap:wrap;padding:4px 10px 12px}
.minion{display:flex;flex-direction:column;align-items:center;width:72px;font-size:10px;text-align:center;color:var(--muted);line-height:1.15}
.minion svg{width:38px;height:38px}
.minion .now{color:var(--work);font-weight:800;margin-top:1px}
.minion.done{opacity:.45;filter:grayscale(.6)}
.minion.done svg{width:28px;height:28px}
.envelope{position:absolute;left:0;top:0;font-size:24px;pointer-events:none;z-index:6}
.dorm{margin-top:22px;background:color-mix(in srgb,#2a2660 8%,var(--card));border-radius:22px;box-shadow:var(--shadow);padding:12px 16px}
.dorm h4{margin:0 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.beds{display:flex;flex-wrap:wrap;gap:6px}
.bed{width:92px;text-align:center;font-size:11px;cursor:pointer;border-radius:12px;padding:4px 2px;word-break:break-word}
.bed:hover{background:var(--bg)} .bed.sel{outline:2px solid var(--orange)}
.bed svg{width:54px;height:54px}
.nobody{color:var(--muted);text-align:center;padding:30px 0}

/* 📊 usage */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:14px 0}
.tile{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.tile .v{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
.tile .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.box{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;margin-top:16px;position:relative}
.box h3{margin:0 0 4px;font-size:15px}
.box .note{font-size:12px;color:var(--muted);margin:0 0 10px}
.bars{display:block;width:100%;height:auto}
.bars .grid{stroke:var(--line);stroke-width:1}
.bars text{font-size:11px;fill:var(--muted)}
.bars .bar{fill:var(--orange)}
.bars .bar.dim{opacity:.45}
.bars .hit{fill:transparent}
.bars .hit:hover + .bar,.bars .bar:hover{opacity:.8}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:12px;display:none;z-index:4;white-space:nowrap}
.utable{width:100%;border-collapse:collapse;font-size:13px}
.utable th{text-align:left;color:var(--muted);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.utable td{padding:8px;border-bottom:1px dashed var(--line);vertical-align:middle}
.utable tr.click{cursor:pointer} .utable tr.click:hover td{background:var(--bg)}
.utable .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.gauge{display:flex;align-items:center;gap:8px;min-width:130px}
.gauge .track{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.gauge .fill{height:100%;border-radius:4px;background:var(--orange)}
.gauge span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);width:44px;text-align:right}
.hbar{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hbar .track{height:12px;border-radius:0 4px 4px 0;background:transparent}
.hbar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--orange);min-width:2px}
.hbar .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.reco{border-left:4px solid var(--orange)}
.reco pre{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12px;overflow:auto;margin:8px 0 0}
.tiplist{list-style:none;margin:0;padding:0}
.tiplist li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tiplist li b{font-weight:800}
.usage-mini{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.spark{display:inline-block;vertical-align:middle}
.spark rect{fill:var(--orange)}

/* tabs */
.tabs{display:inline-flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:6px}
.tabs button{border:none;border-radius:10px;padding:7px 16px;font-weight:800;color:var(--muted);background:none}
.tabs button.on{background:var(--orange);color:#fff}

/* map */
.map{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-top:14px;position:relative;overflow:hidden}
.map svg.g{width:100%;height:auto;display:block}
.map .node{cursor:pointer}
.map .node text{font-weight:800;font-size:13px;fill:var(--ink)}
.map .edge{fill:none;stroke-linecap:round;opacity:.55;cursor:pointer;transition:opacity .15s}
.map .edge:hover,.map .edge.hl{opacity:1}
.map .lbl{font-size:11px;font-weight:800;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 12px;font-size:12px;max-width:340px;display:none;z-index:3}
.tip b{display:block;margin-bottom:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:12px 18px;border-top:1px solid var(--line)}

/* message box */
.compose textarea{width:100%;min-height:80px;resize:vertical;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.compose textarea:focus{outline:none;border-color:var(--orange)}
.compose .row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.compose .send{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:800}
.compose .send:disabled{opacity:.5;cursor:wait}
.compose .buzz{background:#ffc43d;color:#3b2f2a;border-color:#e8a900;font-weight:900;letter-spacing:.3px}
.compose .buzz:hover:not(:disabled){transform:rotate(-3deg) scale(1.05)}
.compose .buzz:disabled{opacity:.4;cursor:not-allowed}
.buzzing{animation:buzz .65s linear}
.node.buzzing{animation:none}
.node.buzzing > svg{animation:buzz .65s linear}
@keyframes buzz{0%,100%{translate:0 0}10%{translate:-7px 2px}20%{translate:6px -3px}30%{translate:-6px -2px}40%{translate:7px 3px}
  50%{translate:-5px 2px}60%{translate:5px -2px}70%{translate:-4px 1px}80%{translate:3px -1px}90%{translate:-2px 0}}
.compose .hint{font-size:12px;color:var(--muted);flex:1 1 100%}
.compose .res{font-size:13px;margin-top:8px;border-radius:10px;padding:7px 10px}
.res.ok{background:color-mix(in srgb,#7cc576 18%,transparent)} .res.err{background:color-mix(in srgb,#e97a7a 20%,transparent)}
.ask{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,#ff6b8a 16%,transparent);border:1.5px solid #ff6b8a;border-radius:14px;padding:10px 12px;margin:0 0 12px}
.ask p{margin:0;flex:1;font-size:13px}
.term{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:800;white-space:nowrap}
.term:disabled{opacity:.5;cursor:wait}
.sleep{background:color-mix(in srgb,var(--sleep) 30%,var(--card));font-weight:800;white-space:nowrap}
.sleep:disabled{opacity:.5;cursor:wait}
.on-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7cc576;box-shadow:0 0 0 3px color-mix(in srgb,#7cc576 25%,transparent)}
</style>
</head>

function ago(sec){
  if (sec < 60) return t('ago_s', {n: Math.max(1, Math.round(sec))});
  if (sec < 3600) return t('ago_m', {n: Math.round(sec/60)});
  if (sec < 86400) return t('ago_h', {n: Math.round(sec/3600)});
  return t('ago_d', {n: Math.round(sec/86400)});
}
const hhmm = ts => ts ? new Date(ts).toLocaleTimeString(LANG === 'ro' ? 'ro-RO' : 'en-GB', {hour:'2-digit', minute:'2-digit'}) : '';

/* activity code from the server -> text */
function activity(a){
  const x = a.activity || {};
  switch (x.k){
    case 'tool': return toolText(x.tool, x.text);
    case 'stopped_at': return t('act_stopped_at', {what: toolText(x.tool, x.text)});
    case 'asks': return t(x.kind === 'approval' ? 'act_approval' : 'act_question') + t(x.mode === 'background' ? 'act_answer_bg' : x.mode === 'codex' ? 'act_answer_codex' : 'act_answer_term');
    case 'idle': return t(x.mode === 'background' ? 'act_idle_bg' : 'act_idle_term');
    case 'untouched': return t(x.mode === 'terminal' ? 'act_untouched_term' : 'act_untouched', {h: x.h});
    default: return t('act_' + (x.k || 'sleeping'));

}

function hashN(s, salt){ let h = salt * 2654435761 >>> 0; for (const c of String(s||'')) h = (Math.imul(h ^ c.charCodeAt(0), 2246822519) >>> 0); h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d) >>> 0; h ^= h >>> 12; h = Math.imul(h, 0x297a2d39) >>> 0; h ^= h >>> 15; return h >>> 0; }
function shade(hex, f){ // f<0 = darker, f>0 = lighter
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const m = v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f);
  return '#' + [m(r), m(g), m(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}

function face(s, ink = '#3b2f2a', mouthInk = ink, glint = '#fff'){

    : `<g class="m-eyes"><circle cx="39" cy="54" r="4.5" fill="${ink}"/><circle cx="61" cy="54" r="4.5" fill="${ink}"/><circle cx="40.5" cy="52.3" r="1.6" fill="${glint}"/><circle cx="62.5" cy="52.3" r="1.6" fill="${glint}"/></g>`;
  const mouth = s === 'working' ? `<path d="M45 64q5 3 10 0" stroke="${mouthInk}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`
    : s === 'waiting' ? `<path d="M43 63q7 7 14 0z" fill="${mouthInk}"/>`

  return eyes + mouth;
}

/* ---------- the period of the Usage tab ---------- */
const URANGES = ['1h', '3h', '6h', '12h', '24h', '3d', '7d', '30d', 'custom'];
let URANGE = store.get('urange') || '24h';
let UCUST = (() => { try{ return JSON.parse(store.get('ucust') || 'null'); }catch(e){ return null; } })();
function rangeQuery(){
  if (TAB !== 'usage') return '';
  if (URANGE === 'custom' && UCUST && UCUST.from) return `&from=${UCUST.from}&to=${UCUST.to || 0}`;
  const m = (URANGE.match(/^(\d+)([hd])$/) || [0, 24, 'h']);
  return `&from=${Math.floor(Date.now() / 1000 - m[1] * (m[2] === 'h' ? 3600 : 86400))}`;
}
const toInput = ts => new Date(ts * 1000 - new Date(ts * 1000).getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const fromInput = v => v ? Math.floor(new Date(v).getTime() / 1000) : 0;
const fmtDur = sec => sec < 3600 ? t('u_min', {n: Math.round(sec / 60)}) : sec < 86400 ? t('u_hr', {n: +(sec / 3600).toFixed(1)}) : t('u_dy', {n: +(sec / 86400).toFixed(1)});
function rangeBar(){
  const R = (DATA && DATA.range) || {from: Date.now() / 1000 - 86400, to: Date.now() / 1000};
  return `<div class="urange">${URANGES.map(k => `<button class="psec ${URANGE === k ? 'on' : ''}" data-r="${k}">${t('r_' + k)}</button>`).join('')}
    ${URANGE === 'custom' ? `<input type="datetime-local" id="ur-from" value="${toInput(R.from)}"> → <input type="datetime-local" id="ur-to" value="${toInput(R.to)}"> <button class="psec on" id="ur-go">${t('r_go')}</button>` : ''}</div>`;
}
function bindRange(){
  document.querySelectorAll('.urange [data-r]').forEach(b => b.onclick = () => {
    URANGE = b.dataset.r; store.set('urange', URANGE); USAGE_KEY = null;
    if (URANGE === 'custom' && !(UCUST && UCUST.from)) UCUST = {from: Math.floor(Date.now() / 1000 - 86400), to: 0};
    render(); load();
  });
  const go = $('#ur-go');
  if (go) go.onclick = () => {
    const a = fromInput($('#ur-from').value), b = fromInput($('#ur-to').value);
    if (!a) return;
    UCUST = {from: a, to: b && b > a ? b : 0}; store.set('ucust', JSON.stringify(UCUST)); USAGE_KEY = null; load();
  };
}

function renderProject(){
  const p = PROJ === '*' ? {name:'*', emoji:'🌈', agents: DATA.projects.flatMap(x => x.agents).sort((a,b)=>a.age-b.age)}
                         : DATA.projects.find(x => x.name === PROJ);

/* ---------- 🏡 workshop: rooms with the agents at work (all from local transcripts, zero tokens) ---------- */
const ZONE_X = {mail:12, terminal:28, desk:48, window:68, shelf:84};
const TOOL_ZONE = {Bash:'terminal', PowerShell:'terminal', Monitor:'terminal', TaskStop:'terminal',
  Edit:'desk', Write:'desk', NotebookEdit:'desk', Read:'shelf', Grep:'shelf', Glob:'shelf',
  WebSearch:'window', WebFetch:'window', SendMessage:'mail', ListAgents:'mail', SendToProject:'mail'};
const ZONE_EFFECT = {terminal:'⌨️', desk:'✏️', shelf:'🔍', window:'🌐', mail:'✉️'};
let WS = {seen:null};

function currentTool(a){
  const l = a.feed[a.feed.length - 1];
  return a.status === 'working' && l && l.kind === 'tool' ? l : null;
}
function zone(a){
  const tl = currentTool(a);
  if (!tl) return 'desk';
  if (tl.tool && tl.tool.startsWith('mcp__claude-in-chrome')) return 'window';
  return TOOL_ZONE[tl.tool] || 'desk';
}
function effect(a, z){
  if (a.asks) return a.asks === 'approval' ? '✋' : '❓';
  if (a.status === 'waiting') return '☕';
  if (a.status === 'stuck') return '😅';
  const tl = currentTool(a);
  if (!tl) return a.subagents.some(s => !s.done && s.age < 120) ? '🐣' : '💭';
  if (tl.tool === 'Agent' || tl.tool === 'Workflow') return '🐣';
  return ZONE_EFFECT[z] || '⚙️';
}
function speech(a){
  if (a.asks) return t(a.asks === 'approval' ? 'speech_approval' : 'speech_question');
  const tl = currentTool(a);
  const s = tl && tl.text ? tl.text : activity(a);
  return s.length > 70 ? s.slice(0, 69) + '…' : s;
}
const ROOM = `<div class="room-top"><span class="name"></span><span class="usage-mini"></span><span class="pillw"></span></div>
  <div class="scene"><div class="wall"></div><div class="planks"></div>
    <div class="prop p-mail">📮</div>
    <div class="prop p-terminal"><div class="screen"></div><div class="stand"></div></div>
    <div class="prop p-window"></div>
    <div class="prop p-desk"><div class="monitor"><i style="width:80%"></i><i style="width:55%"></i><i style="width:68%"></i></div><div class="top"></div><div class="legs"><b></b><b></b></div></div>
    <div class="prop p-shelf"><b></b><b></b><b></b><b></b></div>
    <div class="bot"><div class="speech"></div><div class="masc"></div><div class="effect"></div></div>
  </div><div class="crew"></div>`;

function crewHtml(a){
  const subs = a.subagents;
  if (!subs.length) return '';
  const active = subs.filter(s => !s.done);
  const done = subs.filter(s => s.done);
  const one = (s) => {
    const st = s.done ? 'sleeping' : s.age < 90 ? 'working' : 'waiting';
    const now = s.now ? toolText(s.now.tool, s.now.text) : t(s.age < 90 ? 'sub_working' : 'sub_waiting');
    const d = s.description;
    return `<div class="minion ${s.done?'done':''}" title="${esc(d + (s.now ? ' — ' + now : ''))}">
      ${mascot(hue(d), st, d)}<span>${esc(d.length > 26 ? d.slice(0,25)+'…' : d)}</span>
      ${s.done ? '' : `<span class="now">${esc(now.length > 30 ? now.slice(0,29)+'…' : now)}</span>`}</div>`;
  };
  const shown = [...active, ...done.slice(0, Math.max(0, 6 - active.length))];
  const rest = subs.length - shown.length;
  return `<div class="crew-h">${t('crew', {a: active.length, d: done.length})}</div>
    <div class="crew-list">${shown.map(one).join('')}${rest > 0 ? `<div class="minion"><span style="font-size:20px;margin-top:8px">+${rest}</span></div>` : ''}</div>`;
}

function updateRoom(el, a){
  const c = hue(a.title), z = zone(a);
  el.style.setProperty('--c', c);
  el.dataset.name = a.title; el.dataset.live = a.live_name || '';
  el.dataset.z = a.status === 'working' ? z : '';
  el.classList.toggle('sel', SEL === a.id);
  el.classList.toggle('asking', !!a.asks);
  el.classList.toggle('working', a.status === 'working');
  el.querySelector('.name').textContent = a.title;
  el.querySelector('.usage-mini').textContent = [a.model ? '🧠 ' + modelEffort(a) : '', a.usage && a.usage.context ? '📊 ' + t('per_step', {t: fmtTok(a.usage.context)}) : '', (compactInfo(a) || {}).warm ? '📝' : ''].filter(Boolean).join('  ');
  el.querySelector('.pillw').innerHTML = pill(a) + (a.mode ? ` <span title="${t(a.mode==='background'?'bg_title':'term_title_short')}">${a.mode==='background'?'👻':'🖥️'}</span>` : '');
  const bot = el.querySelector('.bot');
  if (bot.dataset.z !== z){
    if (bot.dataset.z){ bot.classList.add('walking'); clearTimeout(bot._t); bot._t = setTimeout(() => bot.classList.remove('walking'), 1300); }
    bot.dataset.z = z; bot.style.left = ZONE_X[z] + '%';
  }
  const m = el.querySelector('.masc'), mk = a.status + '|' + MASCOTS;
  if (m.dataset.k !== mk){ m.dataset.k = mk; m.innerHTML = mascot(c, a.status, a.title); }
  el.querySelector('.effect').textContent = effect(a, z);
  el.querySelector('.speech').textContent = speech(a);
  const tl = currentTool(a);
  el.querySelector('.screen').textContent = z === 'terminal' && tl ? '$ ' + tl.text : '$ _';
  const crew = el.querySelector('.crew'), ch = crewHtml(a), ck = MASCOTS + ch;
  if (crew.dataset.k !== ck){ crew.dataset.k = ck; crew.innerHTML = ch; }
}

function renderWorkshop(p, head){
  let root = $('#workshop');
  if (!root || root.dataset.p !== p.name || root.dataset.m !== MASCOTS || root.dataset.lang !== LANG){
    $('#main').innerHTML = `<div id="whead"></div><div id="workshop"><div class="floor"></div><div class="nobody" hidden></div><div class="dorm-wrap"></div></div>`;
    root = $('#workshop'); root.dataset.p = p.name; root.dataset.m = MASCOTS; root.dataset.lang = LANG; WS = {seen:null};
  }
  $('#whead').innerHTML = head; bindTabs();
  const floor = root.querySelector('.floor');
  const awake = p.agents.filter(a => a.status !== 'sleeping');
  const ids = new Set(awake.map(a => a.id));
  floor.querySelectorAll('.room').forEach(el => { if (!ids.has(el.dataset.id)) el.remove(); });
  // order: whoever needs you first, then whoever is working
  const rank = a => a.asks ? 0 : a.status === 'stuck' ? 1 : a.status === 'working' ? 2 : 3;
  awake.sort((a, b) => rank(a) - rank(b) || a.title.localeCompare(b.title));
  awake.forEach((a, i) => {
    let el = floor.querySelector(`.room[data-id="${a.id}"]`);
    if (!el){
      el = document.createElement('div'); el.className = 'room'; el.dataset.id = a.id; el.innerHTML = ROOM;
      el.onclick = () => { SEL = a.id; LASTRES = null; render(); };
    }
    if (floor.children[i] !== el) floor.insertBefore(el, floor.children[i] || null);
    updateRoom(el, a);
  });
  const nobody = root.querySelector('.nobody');
  nobody.hidden = awake.length > 0;
  if (!awake.length) nobody.innerHTML = `${mascot('#e8875b','sleeping')}<p>${t('all_asleep')}</p>`;
  const asleep = p.agents.filter(a => a.status === 'sleeping');

/* new messages fly as envelopes from one room to another (You = from the top) */
function envelopes(){
  const edges = DATA.links || [];
  if (!WS.seen){ WS.seen = {}; edges.forEach(e => WS.seen[e.from + '→' + e.to] = e.last); return; }
  edges.forEach(e => {
    const k = e.from + '→' + e.to;
    if (e.last && e.last !== WS.seen[k]){
      WS.seen[k] = e.last;
      if (Date.now() - new Date(e.last).getTime() < 180000) fly(e.from, e.to);
    }
  });
}
function fly(from, to){
  const root = $('#workshop'); if (!root) return;
  const find = n => [...root.querySelectorAll('.room')].find(c => c.dataset.name === n || (c.dataset.live && c.dataset.live === n));
  const A = from === '@you' ? null : find(from), B = find(to);
  if (!B || (!A && from !== '@you')) return;
  const rr = root.getBoundingClientRect();
  const pt = el => { const r = el.querySelector('.bot').getBoundingClientRect(); return {x: r.left + r.width/2 - rr.left - 12, y: r.top + r.height/3 - rr.top}; };
  const a = A ? pt(A) : {x: rr.width/2, y: -30}, b = pt(B);
  const env = document.createElement('div'); env.className = 'envelope'; env.textContent = '✉️';
  root.appendChild(env);
  const mx = (a.x + b.x)/2, my = Math.min(a.y, b.y) - 90;
  const anim = env.animate([
    {transform:`translate(${a.x}px,${a.y}px) scale(.5)`, opacity:0},
    {transform:`translate(${(a.x+mx)/2}px,${(a.y+my)/2}px) scale(1) rotate(-12deg)`, opacity:1, offset:.3},
    {transform:`translate(${mx}px,${my}px) scale(1.25) rotate(8deg)`, opacity:1, offset:.55},
    {transform:`translate(${b.x}px,${b.y}px) scale(.7)`, opacity:1}], {duration:2000, easing:'ease-in-out'});
  anim.onfinish = () => { env.remove(); B.classList.add('got-mail'); setTimeout(() => B.classList.remove('got-mail'), 700); };
}

function fmtTok(n){

  if (n >= 1e6) return (n/1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M';

const fmtUsd = x => '$' + ((x || 0) >= 100 ? Math.round(x).toLocaleString('en-US') : (x || 0).toFixed(2));
const tipText = tp => fill((I18N[LANG].tip || I18N.en.tip)[tp.k] || I18N.en.tip[tp.k] || tp.k,
  Object.fromEntries(Object.entries(tp.p || {}).map(([k, v]) => [k, esc(v)])));

const stepDrop = u => u.per_step && u.per_step.week && u.context < u.per_step.week * 0.8 ? Math.round(100 * (1 - u.context / u.per_step.week)) : 0;
const stepCell = u => `${fmtTok(u.context)} <span class="usage-mini">/ ${u.per_step && u.per_step.week ? fmtTok(u.per_step.week) : '—'}</span>${stepDrop(u) ? ' <b style="color:#3d9a5b">↓</b>' : ''}`;
const WARM_S = 3300;      // the main conversation's cache lives 1 h on a subscription; keep a margin
function compactInfo(a){
  const u = a.usage, c = a.compact || {};
  if (!u || a.wsl || a.engine === 'codex') return null;
  if (c.state === 'running') return {k: 'running'};
  if (c.state && c.t && Date.now() / 1000 - c.t < 1800 && a.status !== 'working') return {k: c.state, c};
  if (u.context < 150000 || a.status === 'working') return null;
  const left = a.cache_age != null ? Math.max(0, Math.round((WARM_S - a.cache_age) / 60)) : 0;
  return {k: 'big', warm: left > 0, left, ctx: u.context};
}
const cmpBadge = a => { const ci = compactInfo(a); return !ci ? '' : ci.k === 'running' ? '<span class="cmpb">📝 …</span>'
  : ci.k === 'big' && ci.warm ? `<span class="cmpb">📝 ${t('cmp_badge')}</span>` : ''; };
function sumUsage(agents){
  const s = {tok:0, cost:0, cr:0, in:0, cw:0, out:0, req:0, sub_tok:0, day:{tok:0, cost:0}, hour:{tok:0, cost:0},
             spark: Array(24).fill(0), models:{}, hist: Array.from({length:11}, () => [0, 0]), max_context:0,
             cross_msgs:0, cross_tok:0, w:{tok:0, cost:0, req:0, cr:0, inp:0, sub_tok:0, own_req:0, own_ctx:0, bins:[], models:{}}};
  for (const a of agents){
    const u = a.usage; if (!u) continue;
    for (const k of ['tok','cost','cr','in','cw','out','req','sub_tok','cross_msgs']) s[k] += u[k] || 0;
    s.cross_tok += u.cross_tok || 0;
    s.day.tok += u.day.tok; s.day.cost += u.day.cost; s.hour.tok += u.hour.tok; s.hour.cost += u.hour.cost;
    u.spark.forEach((v, i) => s.spark[i] += v);
    for (const [m, v] of Object.entries(u.models)){ const x = s.models[m] ||= {tok:0, cost:0}; x.tok += v.tok; x.cost += v.cost; }
    (u.ctx_hist || []).forEach(([n, t], i) => { s.hist[i][0] += n; s.hist[i][1] += t; });
    s.max_context = Math.max(s.max_context, u.max_context || 0);
    const w = u.win; if (!w) continue;
    for (const k of ['tok','cost','req','cr','inp','sub_tok','own_req','own_ctx']) s.w[k] += w[k] || 0;
    w.bins.forEach((v, i) => s.w.bins[i] = (s.w.bins[i] || 0) + v);
    for (const [m, v] of Object.entries(w.models)){ const x = s.w.models[m] ||= {tok:0, cost:0}; x.tok += v.tok; x.cost += v.cost; }

function compactSaving(hist, w){   // same estimate as usage.compact_saving
  let saved = 0;

  return saved;
}

/* single-hue vertical bars with a hover tooltip; marker = optional vertical rule after bucket index */
function barChart(values, labels, tipOf, opts = {}){
  const W = 760, H = opts.h || 170, padL = 44, padB = 22, padT = 8, n = values.length;
  const max = Math.max(...values, 1), bw = (W - padL) / n, gap = 2;
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  let g = '';
  [0, .5, 1].forEach(f => { const yy = y(max * f);
    g += `<line class="grid" x1="${padL}" x2="${W}" y1="${yy}" y2="${yy}"/><text x="${padL - 6}" y="${yy + 4}" text-anchor="end">${fmtTok(max * f)}</text>`; });
  values.forEach((v, i) => {
    const x = padL + i * bw + gap / 2, h = Math.max(0, H - padB - y(v)), w = bw - gap, r = Math.min(4, w / 2, h);
    const top = H - padB - h;
    const d = h > 0 ? `M${x},${H - padB} V${top + r} Q${x},${top} ${x + r},${top} H${x + w - r} Q${x + w},${top} ${x + w},${top + r} V${H - padB} Z` : '';
    g += `<rect class="hit" x="${x}" y="${padT}" width="${w}" height="${H - padT - padB}" data-tip="${esc(tipOf(i))}"/>`;
    if (d) g += `<path class="bar ${opts.dim && opts.dim(i) ? 'dim' : ''}" d="${d}" data-tip="${esc(tipOf(i))}"/>`;
    if (labels[i]) g += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`;
  });
  if (opts.rule != null){
    const xr = padL + opts.rule * bw;
    g += `<line x1="${xr}" x2="${xr}" y1="${padT}" y2="${H - padB}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="${xr + 6}" y="${padT + 12}" style="fill:var(--ink);font-weight:800">${esc(opts.ruleLabel || '')}</text>`;
  }
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

  let es = '', ls = '';
  edges.forEach((e, i) => {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
    const nx = -dy/L, ny = dx/L, off = 34;               // curved, so there and back don't overlap
    const r0 = 52, x1 = a.x + dx/L*r0, y1 = a.y + dy/L*r0, x2 = b.x - dx/L*(r0+6), y2 = b.y - dy/L*(r0+6);
    const mx = (a.x+b.x)/2 + nx*off, my = (a.y+b.y)/2 + ny*off;
    const col = e.from === '@you' ? '#e8875b' : hue(e.from);
    const w = 1.5 + 5 * Math.log(1+e.n) / Math.log(1+maxN);
    const fresh = e.last && (now - new Date(e.last).getTime()) < 15*60*1000;
    const d = `M${x1},${y1} Q${mx},${my} ${x2},${y2}`;
    es += `<path class="edge" data-i="${i}" d="${d}" stroke="${col}" stroke-width="${w}" marker-end="url(#ar-${i})"/>
      <marker id="ar-${i}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${col}"/></marker>`;
    if (fresh) es += `<circle r="5" fill="${col}"><animateMotion dur="1.6s" repeatCount="indefinite" path="${d}"/></circle>`;
    ls += `<text class="lbl" x="${(x1+x2)/2*0.5 + mx*0.5}" y="${(y1+y2)/2*0.5 + my*0.5}" text-anchor="middle">${e.n}</text>`;
  });
  let ns = '';
  for (const n of names){
    const {x, y} = pos[n];
    if (n === '@you'){
      ns += `<g class="node" transform="translate(${x-40},${y-40})"><circle cx="40" cy="40" r="38" fill="var(--bg)" stroke="var(--orange)" stroke-width="3"/>
        <text x="40" y="42" text-anchor="middle" dominant-baseline="central" style="font-size:40px">🙋</text>
        <text x="40" y="104" text-anchor="middle" style="font-size:15px">${t('you')}</text></g>`;
      continue;
    }
    const a = byName(n);
    const st = a ? a.status : 'sleeping';
    const out = a && !inProj.has(a.title) ? ` <tspan style="fill:var(--muted);font-weight:600">· ${esc(projName(a.project))}</tspan>` : '';
    ns += `<g class="node" data-id="${a ? a.id : ''}" transform="translate(${x-55},${y-60})">
      ${mascot(hue(n), st, n).replace('<svg', '<svg width="110" height="110"')}
      <text x="55" y="124" text-anchor="middle" style="font-size:15px">${esc(n.length > 22 ? n.slice(0,21)+'…' : n)}${out}</text>
      ${a && a.running ? `<circle cx="88" cy="22" r="6" fill="#7cc576" stroke="var(--card)" stroke-width="2"/>` : ''}</g>`;
  }
  window._edges = edges;
  return `<div class="map"><svg class="g" viewBox="0 0 ${W} ${H}">${es}${ls}${ns}</svg><div class="tip" id="tip"></div>
    <div class="legend"><span>${t('legend1')}</span><span>${t('legend2')}</span><span><span class="on-dot"></span> ${t('legend3')}</span><span>${t('legend4')}</span></div></div>`;
}

function bindMap(){
  const tip = $('#tip'), box = document.querySelector('.map');
  document.querySelectorAll('.map .edge').forEach(el => {
    el.onmousemove = ev => {
      const e = window._edges[+el.dataset.i], r = box.getBoundingClientRect();
      tip.innerHTML = `<b>${esc(who(e.from))} → ${esc(who(e.to))} · ${t('n_messages', {n: e.n})}</b>` +
        e.recent.slice().reverse().map(m => `<div>${hhmm(m.ts)} · ${esc(m.text)}</div>`).join('');
      tip.style.display = 'block';
      tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - 350) + 'px';
      tip.style.top = (ev.clientY - r.top + 14) + 'px';
    };
    el.onmouseleave = () => tip.style.display = 'none';
  });
  document.querySelectorAll('.map .node[data-id]').forEach(el => el.onclick = () => {
    if (el.dataset.id){ SEL = el.dataset.id; LASTRES = null; renderPanel(); }
  });
}

/* ---------- side panel: details, message, terminal, sleep ---------- */
async function post(path, body){
  try{
    const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...body, lang: LANG})});
    return await r.json();
  }catch(e){ return {ok:false, msg:null, info:t('no_server')}; }
}

  if ($('#rv-send')) $('#rv-send').onclick = () => { if (!SENDING) run('/api/manage', {op: 'review_send', id: a.id}, false); };
  if ($('#rv-x')) $('#rv-x').onclick = () => { if (!SENDING) run('/api/manage', {op: 'review_close', id: a.id}, false); };
  if ($('#term2')) $('#term2').onclick = open;

    if (SENDING) return;

    run('/api/send', {id:a.id, text: t('buzz_text')}, false);

  if ($('#mdl-apply')) $('#mdl-apply').onclick = () => {
    if (SENDING) return;
    const model = $('#mdl').value, effort = $('#eff').value;
    const change = {model: model && model !== a.model ? model : '', effort: effort !== a.effort ? effort : ''};
    if (!change.model && !change.effort) { LASTRES = {ok:false, msg:'nothing_to_change'}; return renderPanel(); }
    if (a.running){
      const v = [change.model && modelName(change.model), change.effort && 'effort ' + change.effort].filter(Boolean).join(' · ');
      if (!confirm(t('mdl_confirm', {t: a.title, v, warn: a.status === 'working' ? t('sleep_warn') : ''}))) return;
    }
    run('/api/model', {id: a.id, ...change}, false);
  };
  P.querySelectorAll('.psec').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    PSECS.has(k) ? PSECS.delete(k) : PSECS.add(k);
    store.set('psecs', [...PSECS].join(','));
    renderPanel();
  });
  if ($('#cmp-now')) $('#cmp-now').onclick = () => { if (!SENDING) run('/api/compact', {id: a.id}, false); };
  if ($('#cmp-sleep')) $('#cmp-sleep').onclick = () => {
    if (!SENDING && confirm(t('cmp_sleep_confirm', {t: a.title}))) run('/api/sleep', {id: a.id, compact: true}, false);
  };
  $('#close').onclick = () => { SEL = null; P.classList.remove('open'); render(); };
  $('#a-edit').onclick = () => agentEditForm(a);
  $('#a-del').onclick = () => { if (!SENDING) deleteAgent(a); };
  if ($('#move')) $('#move').onchange = async e => {
    if (e.target.value === '__new__'){
      const name = (prompt(t('new_project_prompt')) || '').trim();
      if (!name){ e.target.value = a.project; return; }
      await post('/api/project', {id:a.id, name});
      return load();
    }
    await post('/api/assign', {id:a.id, project:e.target.value});
    load();
  };
}

/* ---------- create / edit / delete projects and agents ---------- */
function toast(r){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = (r.ok ? '✅ ' : '⚠️ ') + resultText(r);
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

function modal(title, body, onOk, okLabel){
  document.querySelectorAll('.modal-bg').forEach(x => x.remove());
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal"><h3>${title}</h3><div class="mbody">${body}</div><div class="mres"></div>
    <div class="mbtns"><button class="sleep" data-x>${t(onOk ? 'b_cancel' : 'b_close')}</button>${onOk ? `<button class="term" data-ok>${okLabel || t('b_save')}</button>` : ''}</div></div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc_);
  m.querySelector('[data-x]').onclick = close;
  m.onmousedown = e => { if (e.target === m) close(); };
  if (onOk) m.querySelector('[data-ok]').onclick = async () => {
    const b = m.querySelector('[data-ok]');
    b.disabled = true;
    const r = await onOk(m);
    b.disabled = false;
    if (!r) return;
    if (!r.ok){ m.querySelector('.mres').innerHTML = `<div class="res err">⚠️ ${esc(resultText(r))}</div>`; return; }
    close(); toast(r); load();
  };
  const first = m.querySelector('input:not([type=radio]),textarea,select');
  if (first) first.focus();
  return m;
}

const manage = body => post('/api/manage', body);
const val = (m, id) => (m.querySelector('#' + id) || {}).value || '';

function projectForm(p){
  const pr = p || {};
  const body = `<label>${t('f_name')}</label><input id="f-name" maxlength="40" value="${esc(pr.name || '')}">
    <div class="row2" style="margin-top:12px"><div><label>${t('f_emoji')}</label><input id="f-emoji" maxlength="4" value="${esc(pr.emoji || '📁')}"></div>
      <div><label>${t('f_color')}</label><input id="f-color" type="color" value="${esc(pr.color || PALETTE[(DATA.projects.length) % PALETTE.length])}"></div>
      <div><label>${t('f_desc')}</label><input id="f-desc" maxlength="160" value="${esc(pr.description || '')}"></div></div>
    <label>${t('f_kw')}</label><input id="f-kw" value="${esc((pr.keywords || []).join(', '))}"><p class="note">${t('f_kw_note')}</p>
    <label>${t('f_paths')}</label><input id="f-paths" value="${esc((pr.paths || []).join(', '))}"><p class="note">${t('f_paths_note')}</p>`;
  modal(t(p ? 'm_edit_proj' : 'm_new_proj'), body, async m => {
    const r = await manage({op: p ? 'proj_edit' : 'proj_create', project: p ? p.name : '', name: val(m, 'f-name'),
      emoji: val(m, 'f-emoji'), color: val(m, 'f-color'), description: val(m, 'f-desc'),
      keywords: val(m, 'f-kw'), paths: val(m, 'f-paths')});
    if (r.ok){ PROJ = r.p.name; save(); }
    return r;
  }, t(p ? 'b_save' : 'b_create'));
}

function mergeForm(p){
  const opts = DATA.projects.filter(x => x.name !== p.name && x.name !== '@other')
    .map(x => `<option value="${esc(x.name)}">${x.emoji} ${esc(x.name)}</option>`).join('');
  modal(t('m_merge', {p: esc(p.name)}), `<select id="f-into">${opts}</select><p class="note" style="margin-top:10px">${t('merge_note', {p: esc(p.name)})}</p>`,
    async m => {
      const into = val(m, 'f-into');
      const r = await manage({op: 'proj_merge', project: p.name, into});
      if (r.ok){ PROJ = into; save(); }
      return r;
    }, t('b_merge'));
}

async function deleteProject(p){
  if (!confirm(t('proj_del_confirm', {p: p.name}))) return;
  const r = await manage({op: 'proj_delete', project: p.name});
  toast(r);
  if (r.ok){ PROJ = null; save(); }
  load();
}

function agentForm(projName){
  const all = DATA.projects.flatMap(p => p.agents);
  const mine = all.filter(a => a.project === projName && !a.wsl);
  const folders = [...new Set(mine.concat(all).filter(a => !a.wsl).map(a => a.cwd).filter(Boolean))];
  const popular = Object.entries(mine.reduce((o, a) => (o[a.cwd] = (o[a.cwd] || 0) + 1, o), {})).sort((a, b) => b[1] - a[1]);
  const projOpts = DATA.projects.filter(p => p.name !== '@other').map(p => `<option value="${esc(p.name)}" ${p.name === projName ? 'selected' : ''}>${p.emoji} ${esc(p.name)}</option>`).join('')
    + `<option value="" ${!projName || projName === '@other' || projName === '*' ? 'selected' : ''}>${t('automatic')}</option>`;
  const cxOk = (DATA.codex || {}).available;
  const mOpts = cx => `<option value="">${t('f_default')}</option>` + (cx ? ((DATA.codex || {}).models || []).map(x => `<option value="${esc(x[0])}">${esc(modelName(x[0]))}</option>`)
    : MODEL_CHOICES.map(([m, p]) => `<option value="${m}">${modelName(m)} · ${p}</option>`)).join('');
  const eOpts = cx => `<option value="">${t('f_default')}</option>` + (cx ? CODEX_EFFORTS : EFFORT_CHOICES).map(e => `<option>${e}</option>`).join('');
  const body = `<label>${t('f_name')}</label><input id="f-name" maxlength="60">
    ${cxOk ? `<label>${t('f_engine')}</label><select id="f-engine"><option value="claude">${t('e_claude')}</option><option value="codex">${t('e_codex')}</option></select>` : ''}
    <label>${t('f_project')}</label><select id="f-proj">${projOpts}</select>
    <label>${t('f_folder')}</label><input id="f-folder" list="f-folders" value="${esc(popular.length ? popular[0][0] : '')}">
      <datalist id="f-folders">${folders.map(f => `<option value="${esc(f)}">`).join('')}</datalist><p class="note">${t('f_folder_note')}</p>
    <div class="row2" style="grid-template-columns:1fr 1fr;margin-top:12px">
      <div><label>${t('f_model')}</label><select id="f-model">${mOpts(false)}</select></div>
      <div><label>${t('f_effort')}</label><select id="f-effort">${eOpts(false)}</select></div></div>
    <label>${t('f_first')}</label><textarea id="f-text"></textarea>
    <label>${t('f_where')}</label>
    <label class="radio"><input type="radio" name="f-where" value="term" checked> ${t('w_term')}</label>
    <label class="radio"><input type="radio" name="f-where" value="bg"> ${t('w_bg')}</label>`;
  const md = modal(t('m_new_agent'), body, m => manage({op: 'agent_new', engine: val(m, 'f-engine') || 'claude', name: val(m, 'f-name'), project: val(m, 'f-proj'),
    folder: val(m, 'f-folder'), model: val(m, 'f-model'), effort: val(m, 'f-effort'), text: val(m, 'f-text'),
    background: (m.querySelector('input[name=f-where]:checked') || {}).value === 'bg'}), t('b_start'));
  const eg = md && md.querySelector('#f-engine');
  if (eg) eg.onchange = () => { const cx = eg.value === 'codex';
    md.querySelector('#f-model').innerHTML = mOpts(cx); md.querySelector('#f-effort').innerHTML = eOpts(cx); };
}

function agentEditForm(a){
  const projOpts = DATA.projects.filter(p => p.name !== '@other').map(p => `<option value="${esc(p.name)}" ${p.name === a.project ? 'selected' : ''}>${p.emoji} ${esc(p.name)}</option>`).join('')
    + `<option value="" ${a.project === '@other' ? 'selected' : ''}>${t('automatic')}</option>`;
  modal(t('m_edit_agent'), `<label>${t('f_name')}</label><input id="f-name" maxlength="60" value="${esc(a.title)}">
    <p class="note">${t('f_agent_name_note')}</p>
    <label>${t('f_project')}</label><select id="f-proj">${projOpts}</select>`,
    m => manage({op: 'agent_edit', id: a.id, name: val(m, 'f-name'), project: val(m, 'f-proj')}));
}

async function deleteAgent(a){
  if (!confirm(t('agent_del_confirm', {t: a.title, run: a.running ? t('agent_del_run') : ''}))) return;
  SENDING = true; renderPanel();
  const r = await manage({op: 'agent_delete', id: a.id});
  SENDING = false;
  toast(r);
  if (r.ok){ SEL = null; $('#panel').classList.remove('open'); }
  load();
}

function trashModal(){
  const list = DATA.trash || [];
  const rows = list.map(x => `<div class="trow"><span><b>${esc(x.title || x.id)}</b><br><small>${t('trash_from', {p: esc(projName(x.project || '@other')), a: ago(Date.now() / 1000 - x.t)})}</small></span>
    <button class="term" data-r="${x.id}">${t('trash_restore')}</button><button class="sleep" data-d="${x.id}">${t('trash_purge')}</button></div>`).join('');
  const m = modal(t('trash_title'), rows || `<p class="sub">${t('trash_empty')}</p>`, null);
  const act = async (op, id) => {
    const x = list.find(y => y.id === id);
    if (op === 'trash_purge' && !confirm(t('trash_purge_confirm', {t: x.title || id}))) return;
    const r = await manage({op, id});
    toast(r);
    m.remove();
    await load();
    if ((DATA.trash || []).length) trashModal();
  };
  m.querySelectorAll('[data-r]').forEach(b => b.onclick = () => act('trash_restore', b.dataset.r));
  m.querySelectorAll('[data-d]').forEach(b => b.onclick = () => act('trash_purge', b.dataset.d));
}

/* BUZZ!: a short synthesised buzz + everything showing the agent shakes */
function buzzSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 170;
    lfo.frequency.value = 38; lg.gain.value = 0.05; lfo.connect(lg); lg.connect(g.gain);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09, ctx.currentTime + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
    o.frequency.linearRampToValueAtTime(140, ctx.currentTime + 0.55);
    o.connect(g); g.connect(ctx.destination);
    o.start(); lfo.start(); o.stop(ctx.currentTime + 0.6); lfo.stop(ctx.currentTime + 0.6);
    setTimeout(() => ctx.close(), 800);
  }catch(e){}
}
function buzzEffect(id){
  buzzSound();
  const targets = [$('#panel'), ...document.querySelectorAll(`.ag[data-id="${id}"], .node[data-id="${id}"], .room[data-id="${id}"]`)];
  targets.forEach(el => { if (!el) return; el.classList.remove('buzzing'); void el.offsetWidth; el.classList.add('buzzing'); });
  setTimeout(() => targets.forEach(el => el && el.classList.remove('buzzing')), 700);
}

function save(){ store.set('proj', PROJ); store.set('days', $('#days').value); }
$('#back').onclick = () => { PROJ = null; SEL = null; $('#panel').classList.remove('open'); save(); render(); };
$('#days').onchange = () => { save(); load(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SEL){ SEL = null; $('#panel').classList.remove('open'); render(); } });
function setTheme(th){
  if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme;
  document.querySelectorAll('#themes button').forEach(b => b.classList.toggle('on', b.dataset.th === (th || '')));
  store.set('theme', th || '');
}
document.querySelectorAll('#themes button').forEach(b => b.onclick = () => setTheme(b.dataset.th));
document.querySelectorAll('#mascots button').forEach(b => b.onclick = () => setMascots(b.dataset.m));
document.querySelectorAll('#mascots button').forEach(b => b.classList.toggle('on', b.dataset.m === MASCOTS));
document.querySelectorAll('#langs button').forEach(b => b.onclick = () => setLang(b.dataset.l));
setTheme({noapte:'night'}[store.get('theme', 'tema')] || store.get('theme', 'tema') || '');
setLang(LANG);
load(); setInterval(() => { if (!document.hidden && !document.querySelector('#move:focus')) load(); }, 3000);
</script>
